spring.application.name=appbit-server

# PostgreSQL
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# update = cria/atualiza tabelas automaticamente durante o desenvolvimento

# validate = apenas valida se o banco já possui as tabelas esperadas
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL no console
spring.jpa.show-sql=true

# Dialeto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Gemini (Google AI Studio)
gemini.api.key=${gemini.key:SUA_CHAVE_LOCAL_AQUI}
gemini.model=${gemini.model:gemini-2.5-flash}

# JWT
app.jwt.secret=${jwt.secret}
app.jwt.expiration-ms=${jwt.expiration-ms:86400000}


# Dev — desliga segurança temporária para testar endpoints
spring.security.user.name=admin
spring.security.user.password=dev-only